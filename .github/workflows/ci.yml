name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, chatterino-cmake]
  pull_request:
    branches: [master, chatterino-cmake]

jobs:
  build:
    name: Build
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        config: [shared, static]
        os: [ubuntu-latest, macos-14, windows-latest]
        qt-version: [6.7.*]
      fail-fast: false

    steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        cache-key-prefix: install-qt-action-${{runner.os}}-${{matrix.qt-version}}

    - name: Git Checkout
      uses: actions/checkout@v4

    - name: Enable Developer Command Prompt
      uses: Chatterino/msvc-dev-cmd@v2.0.5
      if: matrix.os == 'windows-latest'

    - name: Build
      run: |
        cmake -B build -G "${{ case(runner.os == 'Windows', 'Ninja', 'Unix Makefiles') }}" -DCMAKE_BUILD_TYPE=Debug
        cmake --build build --parallel

    - name: Run Tests
      run: ctest --output-on-failure
      working-directory: build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        cache-key-prefix: install-qt-action-${{runner.os}}

    - name: Install LCOV
      run: sudo apt install lcov

    - name: Git Checkout
      uses: actions/checkout@v4

    - name: Configure
      run: |
        qmake -v
        ./configure -verbose -config coverage -config no_examples

    - name: Build
      run: make -j2

    - name: Measure Coverage
      run: |
        make coverage
        cat coverage/Irc*.cov > coverage/lcov.info

    - name: Upload Coverage
      uses: codecov/codecov-action@v5.1.2
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        file: coverage/lcov.info
